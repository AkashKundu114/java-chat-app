<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin QR Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body style="background-color: #F8F8F8; color: #111111; font-family: Arial, sans-serif;" class="flex flex-col items-center justify-center min-h-screen p-4">
    
    <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full border border-gray-200">
        <h1 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 8px; color: #5D4037;">User ID Generator</h1>
        <p style="font-size: 0.875rem; color: #666; margin-bottom: 20px;">Use the Java terminal to create the user, then paste the full string below.</p>
        
        <div style="margin-bottom: 15px; border: 1px dashed #5D4037; padding: 15px; background: #FAF3EF; border-radius: 4px;">
            <p style="font-size: 0.8rem; font-weight: bold; color: #5D4037; margin-bottom: 5px;">COMMAND STRING FORMAT:</p>
            <code style="font-size: 0.9rem; background: #fff; padding: 5px; display: block; border-radius: 4px; border: 1px solid #5D4037;">
                LOGIN:username:password
            </code>
        </div>

        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: #333; margin-bottom: 5px;">Paste Login String Here:</label>
        <input id="tokenInput" type="text" style="width: 100%; background: #F0F0F0; border: 1px solid #CCCCCC; padding: 12px; border-radius: 4px; color: #111; margin-bottom: 20px; font-family: monospace;" placeholder="LOGIN:Akash:mypass123">
        
        <button onclick="generate()" style="width: 100%; background: #5D4037; color: white; padding: 12px; border-radius: 4px; font-weight: 600; border: none; cursor: pointer;">Generate QR Code</button>
        
        <div class="flex justify-center mt-8">
            <div id="qrcode" style="background: white; padding: 10px; border: 1px solid #5D4037; box-shadow: 0 4px 10px rgba(0,0,0,0.1);"></div>
        </div>
    </div>

    <script>
        function generate() {
            const token = document.getElementById('tokenInput').value.trim();
            const container = document.getElementById('qrcode');
            container.innerHTML = "";
            
            if(token && token.startsWith('LOGIN:')) {
                new QRCode(container, {
                    text: token,
                    width: 200,
                    height: 200,
                    colorDark : "#000000", 
                    colorLight : "#FFFFFF",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } else {
                container.innerHTML = '<p style="color:red;">Error: Paste the full LOGIN: string.</p>';
            }
        }
    </script>
</body>
</html>
