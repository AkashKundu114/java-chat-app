<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JavaChat RETRO</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <!-- LOGIN -->
    <div id="layer-login">
        <div class="login-card">
            <h2 class="login-title">:: SYSTEM LOGIN ::</h2>
            <div id="debug-console" style="font-family:monospace; font-size:10px; color:#00FF00; background:#000; padding:5px; margin-bottom:10px; height:40px; overflow:hidden; border: 1px solid #00FFFF;">> System Ready.</div>
            <input id="inp-ip" type="text" class="input-box" placeholder="TUNNEL ADDRESS (e.g. yourname.loca.lt)">
            <div class="camera-frame">
                <div id="qr-reader" style="width:100%; height:100%;"></div>
                <div id="camera-placeholder" style="position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#00FFFF;">
                    <i data-lucide="scan" style="width: 32px; height: 32px; color: #00FFFF;"></i>
                </div>
            </div>
            <div class="btn-group">
                <button id="btn-activate-cam" class="btn btn-primary"><i data-lucide="camera"></i> SCAN ID</button>
                <button id="btn-upload-qr" class="btn btn-secondary"><i data-lucide="image"></i> GALLERY</button>
            </div>
            <input type="file" id="inp-file-qr" accept="image/*" class="hidden">
        </div>
    </div>

    <!-- APP -->
    <div id="layer-app" class="hidden">
        <aside id="sidebar-panel" class="sidebar">
            <div class="header">
                <span style="font-weight:bold; font-size:1.1rem; color:#00FFFF;">:: USERS ONLINE ::</span>
            </div>
            <div id="sidebar-list" class="contact-list no-scrollbar">
                <div style="text-align:center; color:#555; margin-top:20px;">Waiting for user list...</div>
            </div>
        </aside>

        <main id="main-chat-panel" class="chat-panel hidden">
            <!-- Header -->
            <div class="header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button id="btn-back-contact" class="btn-icon md:hidden"><i data-lucide="arrow-left" style="color: #00FFFF;"></i></button>
                    <div class="avatar" id="chat-avatar" style="width:35px; height:35px; font-size:14px;">?</div>
                    <span id="chat-header-title" style="font-weight:bold; color:#00FF00;">User</span>
                </div>
                <div id="connection-status" style="font-size:12px; color:#00FFFF;">●</div>
            </div>

            <!-- Messages -->
            <div id="chat-area" class="chat-messages no-scrollbar"></div>

            <!-- Emoji Picker (Hidden by Default) -->
            <div id="emoji-picker" class="hidden">
                <!-- Emojis injected by JS -->
            </div>

            <!-- Input Bar -->
            <form id="form-chat" class="chat-input-area">
                <button type="button" id="btn-emoji" class="btn-icon"><i data-lucide="smile" style="color: #00FFFF;"></i></button>
                <input id="inp-message" type="text" class="input-box-chat" placeholder="TERMINAL INPUT..." autocomplete="off">
                <button type="submit" class="btn-send"><i data-lucide="send" style="width:18px; color: white;"></i></button>
            </form>
        </main>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
