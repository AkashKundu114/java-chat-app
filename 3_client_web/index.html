<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JavaChat Professional</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- LOGIN LAYER -->
    <div id="layer-login">
        <div class="login-card">
            <h2 class="login-title" id="login-title">SECURE LOGIN</h2>
            
            <div id="debug-console" style="font-family:monospace; font-size:10px; color:#5D4037; background:#F8F8F8; padding:5px; margin-bottom:10px; height:40px; overflow:hidden; border:1px solid #CCCCCC;">> System Ready.</div>
            
            <!-- Hidden Input for Tunnel Address -->
            <input id="inp-ip" type="text" class="input-box hidden" value="" aria-hidden="true" readonly>
            
            <!-- Login/Register Inputs -->
            <input id="inp-username" type="text" class="input-box" placeholder="Username">
            <input id="inp-password" type="password" class="input-box" placeholder="Password">

            <!-- Primary Login/Register Button -->
            <button id="btn-submit-auth" class="btn btn-primary" style="margin-bottom: 15px;">
                <i data-lucide="log-in" style="width:20px;"></i> LOGIN
            </button>
            
            <!-- Toggle Button -->
            <button id="btn-toggle-mode" class="btn btn-secondary">
                Don't have an account? **REGISTER**
            </button>
        </div>
    </div>

    <!-- APP LAYER -->
    <div id="layer-app" class="hidden">
        <aside id="sidebar-panel" class="sidebar">
            <div class="header">
                <span style="font-weight:bold; font-size:1.1rem; color:#111;">Contacts</span>
            </div>
            <div id="sidebar-list" class="contact-list no-scrollbar">
                <div style="text-align:center; color:#999; margin-top:20px;">Loading users...</div>
            </div>
        </aside>

        <main id="main-chat-panel" class="chat-panel hidden">
            <!-- Header -->
            <div class="header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button id="btn-back-contact" class="btn-icon"><i data-lucide="arrow-left"></i></button>
                    <div class="avatar" id="chat-avatar" style="width:35px; height:35px; font-size:14px; background: #5D4037; color: white;">?</div>
                    <span id="chat-header-title" style="font-weight:bold; color:#111;">User</span>
                </div>
                <button id="btn-logout" class="btn-icon"><i data-lucide="log-out"></i></button>
            </div>

            <!-- Messages -->
            <div id="chat-area" class="chat-messages no-scrollbar"></div>

            <!-- Emoji Picker (Hidden by Default) -->
            <div id="emoji-picker" class="hidden">
                <!-- Emojis injected by JS -->
            </div>

            <!-- Input Bar -->
            <form id="form-chat" class="chat-input-area">
                <button type="button" id="btn-emoji" class="btn-icon"><i data-lucide="smile"></i></button>
                <input id="inp-message" type="text" class="input-box-chat" placeholder="Type message..." autocomplete="off">
                <button type="submit" class="btn-send"><i data-lucide="send" style="width:18px;"></i></button>
            </form>
        </main>
    </div>

    <!-- Load Main Module -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
