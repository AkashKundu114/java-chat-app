<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- THIS LINE FIXES THE GIANT SIZE ISSUE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JavaChat Mobile</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="layer-login">
        <div class="login-card">
            <h2 class="login-title">Secure Login</h2>
            
            <div id="debug-console" style="font-family:monospace; font-size:10px; color:#4ade80; background:#000; padding:5px; margin-bottom:10px; height:50px; overflow:auto;">
                > Ready.
            </div>

            <input id="inp-ip" type="text" class="input-box" placeholder="Bridge IP">

            <div class="camera-frame">
                <div id="qr-reader" style="width:100%; height:100%;"></div>
                <div id="camera-placeholder" style="position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#64748b;">
                    Tap 'Scan' to start
                </div>
            </div>

            <div class="btn-group">
                <button id="btn-activate-cam" class="btn btn-primary">
                    <i data-lucide="camera"></i> Scan
                </button>
                <button id="btn-upload-qr" class="btn btn-secondary">
                    <i data-lucide="image"></i> Gallery
                </button>
            </div>
            <input type="file" id="inp-file-qr" accept="image/*" class="hidden">
        </div>
    </div>

    <!-- APP SCREEN (Sidebar + Chat) -->
    <div id="layer-app" class="hidden">
        
        <!-- LEFT SIDEBAR -->
        <aside id="sidebar-panel" class="sidebar">
            <div class="header">
                <span style="font-weight:bold; font-size:1.2rem; color:white;">Contacts</span>
            </div>
            <div id="sidebar-list" class="contact-list">
                <div style="text-align:center; color:#64748b; margin-top:20px;">Waiting for network...</div>
            </div>
        </aside>

        <!-- RIGHT CHAT PANEL -->
        <main id="main-chat-panel" class="chat-panel hidden">
            <div class="header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button id="btn-back-contact" style="background:none; border:none; color:#cbd5e1; padding:5px;">
                        <i data-lucide="chevron-left"></i>
                    </button>
                    <span id="chat-header-title" style="font-weight:bold; color:white;">Chat</span>
                </div>
                <div id="connection-status" style="font-size:12px; color:#4ade80;">● Online</div>
            </div>

            <div id="chat-area" class="chat-messages"></div>

            <form id="form-chat" class="chat-input-area">
                <input id="inp-message" type="text" class="input-box" style="margin:0; text-align:left;" placeholder="Message..." autocomplete="off">
                <button type="submit" class="btn btn-primary" style="width:auto; padding:0 20px;">
                    <i data-lucide="send"></i>
                </button>
            </form>
        </main>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
