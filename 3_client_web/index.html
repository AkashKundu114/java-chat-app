<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JavaChat Retro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- LOGIN LAYER -->
    <div id="layer-login">
        <div class="login-card">
            <h2 class="login-title" id="login-title">SECURE LOGIN</h2>
            
            <div id="debug-console" style="font-family:monospace; font-size:10px; color:var(--accent-primary); background:var(--bg-dark); padding:5px; margin-bottom:10px; height:40px; overflow:hidden; border:2px solid var(--border-strong);">> READY</div>
            
            <!-- Hidden Input for Tunnel Address -->
            <input id="inp-ip" type="text" class="input-box hidden" value="" aria-hidden="true" readonly>
            
            <!-- Login/Register Inputs -->
            <input id="inp-username" type="text" class="input-box" placeholder="Username">
            <input id="inp-password" type="password" class="input-box" placeholder="Password">

            <!-- Primary Login/Register Button -->
            <button id="btn-submit-auth" class="btn btn-primary" style="margin-bottom: 12px;">
                <i data-lucide="log-in" style="width:20px;"></i> LOGIN
            </button>
            
            <!-- Toggle Button -->
            <button id="btn-toggle-mode" class="btn btn-secondary">
                Don't have an account? **REGISTER**
            </button>
        </div>
    </div>

    <!-- APP LAYER -->
    <div id="layer-app" class="app-container hidden">
        
        <!-- 1. NAVIGATION PANEL (Leftmost column) -->
        <aside class="nav-panel">
            <div class="nav-top">
                <span class="company-header">JOHNNY WALKER CO.</span>
                <div class="nav-icons">
                    <div class="nav-icon active"><i data-lucide="message-square"></i></div>
                </div>
            </div>
            <div class="nav-bottom">
                <div class="nav-icon logout" id="logout-icon-small"><i data-lucide="log-out"></i></div>
            </div>
        </aside>

        <!-- 2. CONTACTS PANEL (Middle column) -->
        <aside id="sidebar-panel" class="contact-panel">
            <div class="search-bar">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" placeholder="Search contacts..." class="search-input">
            </div>

            <div class="contact-section">
                <div class="section-title">PEOPLE</div>
                <div id="sidebar-list" class="contact-list no-scrollbar">
                    <!-- Contact items will be injected here by JS -->
                </div>
            </div>
        </aside>

        <!-- 3. CHAT MAIN PANEL (Right column) -->
        <main id="main-chat-panel" class="chat-main-panel hidden">
            <div class="chat-header">
                <div class="chat-header-info">
                    <button id="btn-back-contact" class="btn-icon mobile-only"><i data-lucide="arrow-left"></i></button>
                    <div class="avatar-small" id="chat-header-avatar">?</div>
                    <div>
                        <span class="chat-header-name" id="chat-header-name">Select Contact</span>
                        <span class="chat-header-status" id="chat-header-status">OFFLINE</span>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <i data-lucide="phone" class="header-icon"></i>
                    <i data-lucide="video" class="header-icon"></i>
                    <i data-lucide="more-horizontal" class="header-icon"></i>
                </div>
            </div>

            <div id="chat-area" class="chat-messages no-scrollbar">
                <div class="welcome-message">
                    <h3>WELCOME TO TERMINAL CHAT</h3>
                    <p>SYSTEM INITIATED. WAITING FOR USER INPUT...</p>
                </div>
            </div>

            <!-- Input Footer -->
            <form id="form-chat" class="chat-input-container">
                <button type="button" class="input-action-btn"><i data-lucide="paperclip"></i></button>
                
                <input id="inp-message" type="text" placeholder="ENTER COMMAND..." class="message-input">
                
                <button type="button" id="btn-emoji" class="input-action-btn"><i data-lucide="smile"></i></button>
                <button type="submit" class="input-action-btn send-btn"><i data-lucide="send"></i></button>
            </form>

            <!-- Emoji Picker (Hidden by Default) -->
            <div id="emoji-picker" class="emoji-picker hidden">
                <!-- Emojis injected by JS -->
            </div>
        </main>
    </div>

    <!-- Main Logic Script -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
