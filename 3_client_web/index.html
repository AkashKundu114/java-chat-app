<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaChat DM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen overflow-hidden">

    <!-- LOGIN LAYER -->
    <div id="layer-login" class="absolute inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
            <h2 class="text-2xl font-bold text-white text-center mb-6">Secure Login</h2>
            <div class="mb-4"><input id="inp-ip" type="text" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-white" placeholder="Bridge IP"></div>
            <div class="mb-4 bg-black h-64 rounded-xl flex items-center justify-center border-2 border-indigo-500/30 overflow-hidden relative">
                <div id="qr-reader" class="w-full h-full"></div>
                <div id="camera-placeholder" class="absolute inset-0 flex items-center justify-center text-slate-500">Camera Inactive</div>
            </div>
            <button id="btn-activate-cam" class="w-full bg-indigo-600 p-4 rounded-xl font-bold flex justify-center gap-2"><i data-lucide="camera"></i> Scan ID</button>
        </div>
    </div>

    <!-- APP LAYER -->
    <div id="layer-app" class="flex h-full" style="display:none;">
        
        <!-- SIDEBAR (User List) -->
        <aside class="w-1/3 max-w-xs bg-slate-900 border-r border-slate-800 flex flex-col">
            <div class="p-4 border-b border-slate-800">
                <h1 class="font-bold text-lg flex items-center gap-2"><i data-lucide="users" class="text-indigo-400"></i> Contacts</h1>
            </div>
            <div id="sidebar-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Users injected here -->
                <div class="text-center text-slate-500 text-sm mt-4">Waiting for users...</div>
            </div>
        </aside>

        <!-- CHAT AREA -->
        <main class="flex-1 flex flex-col bg-slate-950 relative">
            <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50 backdrop-blur">
                <h2 id="chat-header-title" class="font-bold text-indigo-100">Select a contact</h2>
                <div id="connection-status" class="text-xs text-green-500">● Online</div>
            </header>

            <div id="chat-area" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Messages injected here -->
                <div class="flex h-full items-center justify-center text-slate-600">
                    <p>Select a user from the left to start chatting</p>
                </div>
            </div>

            <form id="form-chat" class="p-4 bg-slate-900 border-t border-slate-800 flex gap-3">
                <input id="inp-message" type="text" class="flex-1 bg-slate-800 text-white rounded-xl px-4 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Type a message..." autocomplete="off">
                <button type="submit" class="bg-indigo-600 p-3 rounded-xl hover:bg-indigo-500 text-white"><i data-lucide="send"></i></button>
            </form>
        </main>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
